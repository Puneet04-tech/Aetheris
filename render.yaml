services:
  - type: web
    name: aetheris-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://aetheris-backend.onrender.com
      - key: FRONTEND_URL
        value: https://aetheris-frontend.vercel.app
      - key: PUSHER_APP_ID
        sync: false
      - key: NEXT_PUBLIC_PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: NEXT_PUBLIC_PUSHER_CLUSTER
        value: mt1
      - key: PORT
        value: 3001
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
